# =============================================================================
# Wix API Client — Spring Boot 설정 예시
# =============================================================================
# 이 파일을 프로젝트의 src/main/resources/application.yml 에 병합하거나,
# application-wix.yml 로 복사하여 프로파일로 사용.
#
# 프로파일 활성화: spring.profiles.active=wix
# =============================================================================

wix:
  api:
    # -------------------------------------------------------------------------
    # [필수] 인증 정보
    # -------------------------------------------------------------------------

    # Wix API Key (환경 변수 또는 직접 입력)
    # 발급: https://manage.wix.com/account/api-keys
    api-key: ${WIX_API_KEY}

    # Site ID 또는 Account ID 중 하나 필수
    # Site ID: 개별 사이트 단위 접근
    site-id: ${WIX_SITE_ID}

    # Account ID: 계정 전체 단위 접근 (site-id 대신 사용 가능)
    # account-id: ${WIX_ACCOUNT_ID}

    # -------------------------------------------------------------------------
    # [선택] HTTP 설정
    # -------------------------------------------------------------------------

    # Wix API Base URL
    # base-url: https://www.wixapis.com

    # 연결 타임아웃 (초)
    # connect-timeout-seconds: 10

    # 읽기 타임아웃 (초)
    # read-timeout-seconds: 30

    # -------------------------------------------------------------------------
    # [선택] 재시도 설정
    # -------------------------------------------------------------------------

    # 최대 재시도 횟수 (HTTP 429, 5xx 에러 시)
    # max-retries: 3

    # 첫 재시도 대기 시간 (밀리초)
    # initial-retry-delay-ms: 1000

    # 재시도 대기 시간 배수 (지수 백오프)
    # retry-multiplier: 2.0

    # 최대 재시도 대기 시간 (밀리초)
    # max-retry-delay-ms: 60000

