plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.wix.api'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring RestClient (spring-web only, not full spring-boot-starter-web)
    implementation 'org.springframework:spring-web:6.1.14'
    implementation 'org.springframework:spring-core:6.1.14'

    // Jackson JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    // Spring Boot auto-configuration (optional)
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:3.2.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.11'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.2.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'wix-api-client'
        }
    }
}
