<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wix Admin</title>
<style>
  :root{
    --bg:#fff;--sf:#f5f5f5;--bd:#ddd;--bds:#111;
    --tx:#111;--tx2:#555;--txm:#999;
    --acc:#111;--inv:#fff;--hov:#f0f0f0;
    --ok:#0a7d0a;--err:#c00;
    --jk:#111;--js:#0a6b2a;--jn:#0055aa;--jb:#7700aa;--jnl:#c00;
    --f:-apple-system,'Helvetica Neue',Arial,sans-serif;
    --m:'SF Mono',Menlo,Consolas,monospace;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--f);font-size:13px;line-height:1.5;color:var(--tx);background:var(--bg)}
  .app{display:flex;flex-direction:column;height:100vh}
  .hd{display:flex;align-items:center;height:44px;padding:0 24px;border-bottom:1px solid var(--bd);flex-shrink:0}
  .hd-t{font-size:14px;font-weight:800}
  .hd-s{margin-left:auto;display:flex;align-items:center;gap:8px}
  .hd-label{font-family:var(--m);font-size:10px;font-weight:700}
  .hd-label.ok{color:var(--ok)}.hd-label.fail{color:var(--err)}.hd-label.idle{color:var(--txm)}
  .hd-btn{font-size:11px;font-weight:600;padding:4px 12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx2);cursor:pointer}
  .hd-btn:hover{border-color:var(--bds);color:var(--tx)}
  .bdy{flex:1;display:flex;min-height:0}
  .side{width:200px;flex-shrink:0;border-right:1px solid var(--bd);overflow-y:auto;padding:8px 0}
  .sg{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--txm);padding:12px 20px 4px}
  .si{display:block;width:100%;text-align:left;font-family:inherit;font-size:13px;background:none;border:none;padding:7px 20px;color:var(--tx2);cursor:pointer;transition:all .1s}
  .si:hover{color:var(--tx);background:var(--hov)}
  .si.on{color:var(--acc);font-weight:700;background:var(--sf);border-right:2px solid var(--acc)}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bc{display:flex;align-items:center;gap:6px;padding:0 24px;height:36px;border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0;font-size:12px}
  .bc a{color:var(--tx2);text-decoration:none;cursor:pointer}.bc a:hover{color:var(--tx);text-decoration:underline}
  .bc .sep{color:var(--txm)}.bc .cur{color:var(--tx);font-weight:600}
  .tb{display:flex;align-items:center;gap:12px;padding:0 24px;height:40px;border-bottom:1px solid var(--bd);flex-shrink:0}
  .tb-t{font-size:14px;font-weight:700}.tb-c{font-size:12px;color:var(--tx2)}
  .tb-r{margin-left:auto;display:flex;align-items:center;gap:8px}
  .tb-pg{font-family:var(--m);font-size:11px;color:var(--tx2)}
  .tb-btn{font-size:11px;font-weight:600;padding:4px 12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx2);cursor:pointer}
  .tb-btn:hover{border-color:var(--bds);color:var(--tx)}.tb-btn:disabled{opacity:.3;cursor:not-allowed}
  .tb-btn.acc{background:var(--acc);color:var(--inv);border-color:var(--acc)}.tb-btn.acc:hover{opacity:.85}
  .tw{flex:1;overflow:auto}
  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--tx2);padding:8px 16px;border-bottom:2px solid var(--bds);position:sticky;top:0;background:var(--bg);z-index:1;white-space:nowrap;cursor:pointer;user-select:none}
  .tbl th:hover{color:var(--tx)}.tbl th .ar{font-size:9px;margin-left:3px;color:var(--txm)}
  .tbl td{padding:7px 16px;border-bottom:1px solid var(--bd);font-size:12px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbl tr{cursor:pointer;transition:background .08s}.tbl tr:hover td{background:var(--hov)}
  .tbl td.mo{font-family:var(--m);font-size:11px}
  .tbl td .jb{font-family:var(--m);font-size:10px;color:var(--txm);background:var(--sf);border:1px solid var(--bd);padding:1px 5px;cursor:pointer}
  .tbl td .jb:hover{color:var(--tx);border-color:var(--bds)}
  .tbl td .tag{display:inline-block;font-size:10px;font-weight:600;padding:0 5px;border:1px solid var(--bd);color:var(--tx2)}
  .det{flex:1;overflow:auto;padding:24px}
  .ds{border:1px solid var(--bd);margin-bottom:16px}
  .ds-h{padding:6px 16px;font-size:11px;font-weight:700;color:var(--tx2);background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;cursor:pointer;user-select:none}
  .ds-h:hover{color:var(--tx)}.ds-h .ar{margin-right:6px;font-size:9px;transition:transform .15s;display:inline-block}
  .ds-h .ar.cl{transform:rotate(-90deg)}
  .ds-b{overflow:hidden;transition:max-height .2s}.ds-b.cl{max-height:0!important}
  .dg{display:grid;grid-template-columns:160px 1fr;gap:0}
  .dk{padding:8px 16px;font-size:12px;font-weight:600;color:var(--tx2);background:var(--sf);border-bottom:1px solid var(--bd)}
  .dv{padding:8px 16px;font-size:12px;font-family:var(--m);background:var(--bg);border-bottom:1px solid var(--bd);word-break:break-all}
  .dv.lk{cursor:pointer;color:var(--tx2)}.dv.lk:hover{color:var(--tx);background:var(--hov)}
  .dr{border:1px solid var(--bd)}
  .dr-h{padding:6px 16px;font-size:11px;font-weight:700;color:var(--tx2);background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
  .dr-h a{font-weight:400;color:var(--txm);cursor:pointer;text-decoration:none}.dr-h a:hover{color:var(--tx)}
  .dr-b{padding:16px;max-height:400px;overflow:auto}
  .dr-b pre{font-family:var(--m);font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
  .dr-b .key{color:var(--jk);font-weight:600}.dr-b .str{color:var(--js)}.dr-b .num{color:var(--jn)}.dr-b .bool{color:var(--jb)}.dr-b .null{color:var(--jnl)}
  /* Inbox Card List */
  .inbox-list{flex:1;overflow:auto}
  .inbox-card{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .08s}
  .inbox-card:hover{background:var(--hov)}
  .inbox-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--inv);flex-shrink:0}
  .inbox-body{flex:1;min-width:0}
  .inbox-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .inbox-preview{font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .inbox-meta{flex-shrink:0;text-align:right}
  .inbox-date{font-size:11px;color:var(--txm)}
  .inbox-ch{font-size:10px;color:var(--txm);margin-top:2px}
  .inbox-nomsg{opacity:.4}

  /* Message Thread */
  .msg-list{flex:1;overflow:auto;padding:16px 24px}
  .msg-item{display:flex;gap:12px;margin-bottom:16px}
  .msg-item.out{flex-direction:row-reverse}
  .msg-ava{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--inv);flex-shrink:0}
  .msg-bubble{max-width:70%;padding:10px 14px;font-size:12px;line-height:1.5}
  .msg-item.in .msg-bubble{background:var(--sf);border:1px solid var(--bd)}
  .msg-item.out .msg-bubble{background:var(--acc);color:var(--inv);border:1px solid var(--acc)}
  .msg-meta{font-size:10px;color:var(--txm);margin-top:4px;display:flex;gap:8px;align-items:center}
  .msg-item.out .msg-meta{justify-content:flex-end}
  .msg-type{font-size:9px;font-weight:700;padding:1px 4px;border:1px solid var(--bd);background:var(--bg);color:var(--tx2)}
  .msg-form-fields{margin-top:6px}
  .msg-form-fields .ff{display:flex;gap:8px;font-size:11px;padding:2px 0;border-bottom:1px solid var(--bd)}
  .msg-form-fields .ff-n{font-weight:600;color:var(--tx2);min-width:100px}
  .msg-form-fields .ff-v{color:var(--tx)}
  .msg-minimal{font-style:italic;color:var(--txm)}

  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--txm);font-size:13px;gap:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sp{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
  .mo-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;align-items:center;justify-content:center}
  .mo-bg.open{display:flex}
  .moo{background:var(--bg);border:1px solid var(--bds);width:640px;max-height:85vh;display:flex;flex-direction:column}
  .mo-h{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--bd);font-size:14px;font-weight:700}
  .mo-h a{color:var(--tx2);cursor:pointer;text-decoration:none;font-weight:400;font-size:12px}
  .mo-b{flex:1;overflow:auto;padding:20px}
  .mo-b pre{font-family:var(--m);font-size:12px;white-space:pre-wrap;word-break:break-all;line-height:1.7}
  .mo-b .key{color:var(--jk);font-weight:600}.mo-b .str{color:var(--js)}.mo-b .num{color:var(--jn)}.mo-b .bool{color:var(--jb)}.mo-b .null{color:var(--jnl)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <span class="hd-t">Wix Admin</span>
    <div class="hd-s"><span class="hd-label idle" id="connLabel">Not connected</span><button class="hd-btn" onclick="openSet()">Settings</button></div>
  </div>
  <div class="bdy">
    <div class="side">
      <div class="sg">CRM</div>
      <button class="si on" data-p="contacts" onclick="nav('contacts')">Contacts</button>
      <button class="si" data-p="members" onclick="nav('members')">Members</button>
      <button class="si" data-p="labels" onclick="nav('labels')">Labels</button>
      <div class="sg">Content</div>
      <button class="si" data-p="cms" onclick="nav('cms')">CMS Collections</button>
      <div class="sg">Communication</div>
      <button class="si" data-p="inbox" onclick="nav('inbox')">Inbox</button>
      <div class="sg">Settings</div>
      <button class="si" data-p="seo" onclick="nav('seo')">SEO / robots.txt</button>
    </div>
    <div class="main" id="M"></div>
  </div>
</div>
<div class="mo-bg" id="setMo" onclick="event.target===this&&closeSet()">
  <div class="moo" style="width:520px">
    <div class="mo-h"><span>API Credentials</span><a onclick="closeSet()">Close</a></div>
    <div class="mo-b">
      <div style="margin-bottom:14px"><label style="display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:3px">API Key</label>
        <input type="password" id="cAK" style="width:100%;font-family:var(--m);font-size:13px;padding:8px 10px;border:1px solid var(--bd);outline:none" placeholder="IST.xxxxxxxx..."></div>
      <div style="margin-bottom:14px"><label style="display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:3px">Site ID</label>
        <input type="text" id="cSI" style="width:100%;font-family:var(--m);font-size:13px;padding:8px 10px;border:1px solid var(--bd);outline:none" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:20px">
        <button class="tb-btn acc" onclick="testSave()" id="btnSv">Test & Save</button>
        <span class="hd-label idle" id="setLbl"></span></div>
    </div>
  </div>
</div>
<div class="mo-bg" id="jMo" onclick="event.target===this&&closeJ()">
  <div class="moo"><div class="mo-h"><span id="jT">Detail</span><a onclick="closeJ()">Close</a></div>
    <div class="mo-b"><pre id="jB"></pre></div></div>
</div>

<script>
/* ═══ Helpers ═══ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const hl = o => JSON.stringify(o,null,2).replace(/("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
  m=>{let c='num';if(/^"/.test(m))c=/:$/.test(m)?'key':'str';else if(/true|false/.test(m))c='bool';else if(/null/.test(m))c='null';return`<span class="${c}">${esc(m)}</span>`});
const fmtDate = s => s ? s.replace('T',' ').slice(0,19) : '-';
const isUUID = s => /^[a-f0-9-]{20,}$/i.test(s);

/* ═══ Data Extractors — typed column rendering ═══ */
const fmtWixDate = v => {
  if(!v) return '-';
  if(typeof v==='string') return fmtDate(v);
  if(v?.$date) return fmtDate(v.$date);
  return '-';
};

const X = {
  'info':         v => v?.name ? `${v.name.first||''} ${v.name.last||''}`.trim() : '-',
  'primaryInfo':  v => v?.email || '-',
  'primaryEmail': v => v?.email || '-',
  'source':       v => v?.sourceType || '-',
  'lastActivity': v => v?.activityType ? `${v.activityType} (${fmtDate(v.date||v.activityDate)})` : '-',
  'picture':      v => v?.url ? 'img' : '-',
  'profile':      v => v?.nickname || v?.slug || '-',
  'memberInfo':   v => v?.status || '-',
  'participant':  v => v?.name || JSON.stringify(v||{}).slice(0,40),
  'business':     v => v?.name || '-',
  'channels':     v => Array.isArray(v) ? v.join(', ') : '-',
  'content':      v => v?.previewText || (typeof v==='object'?JSON.stringify(v).slice(0,50):String(v||'')),
  'sender':       v => v?.contactId ? 'Contact' : 'Business',
  'data':         v => typeof v==='object' ? `{${Object.keys(v||{}).length} fields}` : String(v),
  'fields':       v => Array.isArray(v) ? `${v.length} fields` : '-',
  'permissions':  v => v ? `R:${v.read||'-'} W:${v.insert||'-'}` : '-',
};

const extractDisplay = (key, val) => {
  if (val === null || val === undefined) return '-';
  if (X[key]) return X[key](val);
  if (typeof val === 'object') {
    if (val.$date) return fmtDate(val.$date);
    return JSON.stringify(val).slice(0,50)+'...';
  }
  return String(val);
};

/* ═══ State ═══ */
let pg='contacts', off=0, lim=50, ld=null, dd=null, cmsC=null, convId=null, sCol=null, sDir=1;
const hist=[];

/* ═══ API ═══ */
const cred = () => ({k:$('cAK').value.trim(), s:$('cSI').value.trim()});
const hdrs = () => ({'X-Wix-Api-Key':cred().k, 'X-Wix-Site-Id':cred().s});

const api = async (url, opt={}) => {
  opt.headers = {...opt.headers, ...hdrs()};
  if (opt.body && typeof opt.body==='object') { opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(opt.body); }
  const r = await fetch(url, opt);
  const txt = await r.text();
  let d; try{d=JSON.parse(txt)}catch{d=txt}
  if (!r.ok) throw {status:r.status, data:d};
  return d;
};

/* ═══ Navigation ═══ */
const nav = (p, o=0) => {
  hist.length=0; pg=p; off=o; dd=null; cmsC=null; convId=null; sCol=null; sDir=1;
  document.querySelectorAll('.si').forEach(b => b.classList.toggle('on', b.dataset.p===p));
  load();
};

const push = (extra={}) => {
  hist.push({pg,off,ld,dd,cmsC,convId,sCol,sDir});
  Object.entries(extra).forEach(([k,v]) => {
    if(k==='pg')pg=v; else if(k==='off')off=v; else if(k==='dd')dd=v;
    else if(k==='cmsC')cmsC=v; else if(k==='convId')convId=v;
  });
  sCol=null; sDir=1; load();
};

const back = () => {
  if(!hist.length)return;
  const s=hist.pop();
  pg=s.pg;off=s.off;ld=s.ld;dd=s.dd;cmsC=s.cmsC;convId=s.convId;sCol=s.sCol;sDir=s.sDir;
  renderCached();
};

const renderCached = () => {
  try{
    const map = {contacts:renderContacts, members:renderMembers, labels:renderLabels,
      cms:renderCms, 'cms-items':renderCmsItems, inbox:renderInbox,
      'inbox-detail':renderInboxDetail, 'inbox-msgs':renderInboxMsgs, detail:renderDetail};
    (map[pg]||load)();
  }catch{load()}
};

const showLoading = (msg='Loading...') => {
  $('M').innerHTML=`<div class="empty"><span class="sp"></span>${esc(msg)}</div>`;
};

/* ═══ Router ═══ */
const load = async () => {
  showLoading();
  try{
    switch(pg){
      case 'contacts': ld=await api(`/api/contacts?limit=${lim}&offset=${off}`); renderContacts(); break;
      case 'members': ld=await api(`/api/members?limit=${lim}&offset=${off}`); renderMembers(); break;
      case 'labels': ld=await api(`/api/contacts/labels?limit=${lim}&offset=${off}`); renderLabels(); break;
      case 'cms': ld=await api(`/api/cms/collections?limit=${lim}&offset=${off}`); renderCms(); break;
      case 'cms-items': ld=await api(`/api/cms/items?collectionId=${encodeURIComponent(cmsC)}&limit=${lim}&offset=${off}`); renderCmsItems(); break;
      case 'inbox': showLoading('Scanning contacts for conversations...'); ld=await api('/api/inbox/conversations?scanPages=10'); renderInbox(); break;
      case 'inbox-detail': showLoading('Loading conversation...'); ld=await api(`/api/inbox/conversations/${encodeURIComponent(convId)}/detail?contactId=${encodeURIComponent(_inboxContactId)}`); renderInboxDetail(); break;
      case 'inbox-msgs': showLoading('Loading messages...'); ld=await api(`/api/inbox/conversations/${encodeURIComponent(convId)}/messages?limit=30&visibility=BUSINESS`); renderInboxMsgs(); break;
      case 'seo': dd=await api('/api/seo/robots'); pg='detail'; renderDetail(); break;
      case 'detail': renderDetail(); break;
    }
  }catch(e){
    const msg = e.data?.message || e.message || JSON.stringify(e);
    $('M').innerHTML=`<div class="empty" style="color:var(--err)">Error: ${esc(msg)}</div>`;
  }
};

/* ═══ Contacts ═══ */
const CONTACT_COLS = [
  {key:'id',          label:'ID'},
  {key:'info',        label:'Name',     fmt: v => X.info(v)},
  {key:'primaryInfo', label:'Email',    fmt: v => X.primaryInfo(v)},
  {key:'info',        label:'Phone',    fmt: v => v?.phones?.items?.[0]?.phone || '-', sortKey:'_phone'},
  {key:'info',        label:'Company',  fmt: v => v?.company || '-', sortKey:'_company'},
  {key:'source',      label:'Source',   fmt: v => X.source(v)},
  {key:'lastActivity',label:'Last Activity', fmt: v => X.lastActivity(v)},
  {key:'createdDate', label:'Created',  fmt: fmtDate},
];
const renderContacts = () => {
  const rows = ld.contacts||[], pm = ld.pagingMetadata||{};
  $('M').innerHTML = toolbar('Contacts', pm.total||rows.length, rows.length) + smartTable(rows, CONTACT_COLS, i => {
    const sorted = doSort(rows, CONTACT_COLS); push({pg:'detail', dd:sorted[i]});
  });
};

/* ═══ Members ═══ */
const MEMBER_COLS = [
  {key:'id',             label:'ID'},
  {key:'profile',        label:'Nickname',  fmt: v => v?.nickname||'-'},
  {key:'loginEmail',     label:'Email'},
  {key:'status',         label:'Status'},
  {key:'activityStatus', label:'Activity'},
  {key:'privacyStatus',  label:'Privacy'},
  {key:'createdDate',    label:'Created',   fmt: fmtDate},
  {key:'updatedDate',    label:'Updated',   fmt: fmtDate},
];
const renderMembers = () => {
  const rows = ld.members||[], pm = ld.pagingMetadata||{};
  $('M').innerHTML = toolbar('Members', pm.total||rows.length, rows.length) + smartTable(rows, MEMBER_COLS, i => {
    const sorted = doSort(rows, MEMBER_COLS); push({pg:'detail', dd:sorted[i]});
  });
};

/* ═══ Labels ═══ */
const LABEL_COLS = [
  {key:'key',        label:'Key'},
  {key:'displayName',label:'Name'},
  {key:'labelType',  label:'Type'},
  {key:'createdDate',label:'Created', fmt: fmtDate},
];
const renderLabels = () => {
  const rows = ld.labels||[], pm = ld.pagingMetadata||{};
  $('M').innerHTML = toolbar('Labels', pm.total||rows.length, rows.length) + smartTable(rows, LABEL_COLS, i => {
    const sorted = doSort(rows, LABEL_COLS); push({pg:'detail', dd:sorted[i]});
  });
};

/* ═══ CMS ═══ */
const renderCms = () => {
  const rows = ld.collections||[], pm = ld.pagingMetadata||{};
  const cols = [
    {key:'id',label:'ID'},
    {key:'displayName',label:'Name'},
    {key:'fields',label:'Fields',fmt:v=>Array.isArray(v)?`${v.length} fields`:'-'},
    {key:'permissions',label:'Permissions',fmt:v=>v?`R:${v.read||'-'} W:${v.insert||'-'}`:'-'},
  ];
  $('M').innerHTML = toolbar('CMS Collections', pm.total||rows.length, rows.length) + smartTable(rows, cols, i => {
    const sorted = doSort(rows, cols);
    push({pg:'cms-items', cmsC:sorted[i].id, off:0});
  });
};

// CMS items: prioritize name/email fields, parse $date objects
const CMS_PRIORITY_KEYS = ['firstName','lastName','email','submissionTime','_createdDate','_updatedDate','title','name','slug'];

const renderCmsItems = () => {
  const rows = ld.dataItems||[], pm = ld.pagingMetadata||{};
  const m = $('M');
  m.innerHTML = mkBc([{label:'CMS',action:'back()'},{label:cmsC}]) + toolbar('Items: '+cmsC, pm.total||rows.length, rows.length);
  if(!rows.length){m.innerHTML+='<div class="empty">No items</div>';return}

  // Collect all data keys, prioritize known fields
  const allKs = new Set(); rows.forEach(r=>{if(r.data)Object.keys(r.data).forEach(k=>allKs.add(k))});
  const priority = CMS_PRIORITY_KEYS.filter(k => allKs.has(k));
  const rest = [...allKs].filter(k => !priority.includes(k) && k!=='_id' && k!=='_owner');
  const dataKeys = [...priority, ...rest];

  const cols = [{key:'id',label:'ID'}, ...dataKeys.map(k=>({key:'_data.'+k, label:k, extract:r=>r.data?.[k]}))];
  let h='<div class="tw"><table class="tbl"><thead><tr>';
  cols.forEach(c => h+=`<th onclick="sortBy('${esc(c.key)}')">${esc(c.label)}<span class="ar">${sCol===c.key?(sDir>0?'▲':'▼'):''}</span></th>`);
  h+='</tr></thead><tbody>';
  const sorted = [...rows].sort((a,b)=>{
    if(!sCol)return 0;
    const dk = sCol.replace('_data.','');
    const va = sCol==='id'?a.id:a.data?.[dk];
    const vb = sCol==='id'?b.id:b.data?.[dk];
    const sa = fmtCmsVal(va), sb = fmtCmsVal(vb);
    return sa.localeCompare(sb)*sDir;
  });
  sorted.forEach((r,i) => {
    h+=`<tr onclick="showCmsDetail(${rows.indexOf(r)})">`;
    cols.forEach(c => {
      const v = c.extract ? c.extract(r) : r[c.key];
      h += cmsCell(v, c.key);
    });
    h+='</tr>';
  });
  m.innerHTML += h+'</tbody></table></div>';
};

const showCmsDetail = i => push({pg:'detail', dd:(ld.dataItems||[])[i]});

// CMS cell: handle $date, long text, objects
const cmsCell = (v, key) => {
  if(v==null) return '<td style="color:var(--txm)">-</td>';
  if(typeof v==='object'){
    if(v.$date) return `<td class="mo">${esc(fmtDate(v.$date))}</td>`;
    const s=JSON.stringify(v); const sh=s.length>40?s.slice(0,40)+'...':s;
    const lbl = key.replace('_data.','');
    return `<td><span class="jb" onclick="event.stopPropagation();openJ('${esc(lbl)}','${esc(s)}')" title="${esc(s)}">${esc(sh)}</span></td>`;
  }
  const s=String(v);
  return `<td${isUUID(s)?' class="mo"':''}${s.length>30?' title="'+esc(s)+'"':''}>${esc(s.length>60?s.slice(0,60)+'...':s)}</td>`;
};

const fmtCmsVal = v => {
  if(v==null) return '';
  if(typeof v==='object') return v.$date||JSON.stringify(v);
  return String(v);
};

/* ═══ Inbox ═══ */
// Avatar color palette
const AVATAR_COLORS = ['#7B68EE','#20B2AA','#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#98D8C8','#F7DC6F','#BB8FCE','#85C1E9'];
const avatarColor = name => AVATAR_COLORS[Math.abs([...name].reduce((h,c)=>((h<<5)-h)+c.charCodeAt(0),0)) % AVATAR_COLORS.length];

const renderInbox = () => {
  const convs = (ld.conversations || []).slice().sort((a, b) => {
    if (a.hasMessages !== b.hasMessages) return a.hasMessages ? -1 : 1;
    return (b.lastDate || '').localeCompare(a.lastDate || '');
  });
  ld.conversations = convs;
  const m = $('M');
  const active = ld.activeCount || convs.filter(c=>c.hasMessages).length;
  const scanned = ld.totalScanned || convs.length;
  const total = ld.totalContacts || scanned;
  m.innerHTML = `<div class="tb"><span class="tb-t">Inbox</span><span class="tb-c">${active} active / ${scanned} scanned (${total} contacts)</span><div class="tb-r" style="font-size:10px;color:var(--txm)">Contacts 기반 조회 — 익명 Visitor 대화는 REST API 미지원</div></div>`;

  let h = '<div class="inbox-list">';
  convs.forEach((c, i) => {
    const noMsg = !c.hasMessages;
    const color = avatarColor(c.contactName || '?');
    const dateLabel = c.lastDate ? fmtRelativeDate(c.lastDate) : '';
    const preview = c.lastPreview || (noMsg ? 'No messages' : '');
    const chLabel = c.channels?.length ? c.channels.join(', ') : '';
    const typeIcon = {BASIC:'💬',MINIMAL:'📩',FORM:'📋',TEMPLATE:'📄',SYSTEM:'⚙️'}[c.lastContentType] || '';

    h += `<div class="inbox-card${noMsg?' inbox-nomsg':''}" onclick="openConvMsgs(${i})">`;
    h += `<div class="inbox-avatar" style="background:${color}">${esc(c.initials||'?')}</div>`;
    h += `<div class="inbox-body">`;
    h += `<div class="inbox-name">${esc(c.contactName||'Unknown')}</div>`;
    h += `<div class="inbox-preview">${typeIcon} ${esc(preview)}</div>`;
    h += `</div>`;
    h += `<div class="inbox-meta">`;
    h += `<div class="inbox-date">${esc(dateLabel)}</div>`;
    h += `<div class="inbox-ch">${esc(chLabel)}</div>`;
    h += `</div></div>`;
  });
  h += '</div>';
  m.innerHTML += h;
};

let _inboxContactId = '';
const openConvMsgs = i => {
  const c = (ld.conversations||[])[i];
  if(!c?.conversationId) return;
  _inboxContactId = c.contactId || '';
  push({pg:'inbox-detail', convId:c.conversationId, off:0});
};

const fmtRelativeDate = s => {
  if(!s) return '';
  const d = new Date(s), now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if(diff === 0) return d.toLocaleTimeString('ko',{hour:'2-digit',minute:'2-digit'});
  if(diff === 1) return 'Yesterday';
  if(diff < 7) return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  return d.toLocaleDateString('ko',{month:'short',day:'numeric'});
};

/* ═══ Inbox Detail ═══ */
const renderInboxDetail = () => {
  const conv = ld.conversation || {};
  const contact = ld.contact || {};
  const m = $('M');

  let h = mkBc([{label:'Inbox',action:'back()'},{label: conv.participantDisplayData?.name || convId}]);

  // Toolbar with actions
  h += `<div class="tb"><span class="tb-t">${esc(conv.participantDisplayData?.name || 'Conversation')}</span>`;
  h += `<span class="tb-c">${esc(ld.messageCount||'0')} messages</span>`;
  h += `<div class="tb-r"><a class="tb-btn" onclick="push({pg:'inbox-msgs',convId:'${esc(convId)}',off:0})">View Messages</a></div></div>`;

  h += '<div class="det">';

  // Conversation Info
  h += mkSec('Conversation', () => {
    let g = '<div class="dg">';
    g += `<div class="dk">Conversation ID</div><div class="dv">${esc(conv.id||convId)}</div>`;
    g += `<div class="dk">Channels</div><div class="dv">${esc((conv.channels||[]).join(', '))}</div>`;
    if (conv.participantDisplayData) {
      const pd = conv.participantDisplayData;
      g += `<div class="dk">Participant</div><div class="dv">${esc(pd.name||'-')}</div>`;
      if (pd.imageUrl) g += `<div class="dk">Avatar</div><div class="dv"><img src="${esc(pd.imageUrl)}" style="width:32px;height:32px;border-radius:50%"></div>`;
    }
    if (conv.businessDisplayData) {
      const bd = conv.businessDisplayData;
      g += `<div class="dk">Business</div><div class="dv">${esc(bd.name||'-')}</div>`;
    }
    if (ld.lastMessageDate) g += `<div class="dk">Last Message</div><div class="dv">${esc(fmtDate(ld.lastMessageDate))}</div>`;
    g += '</div>';
    return g;
  }, true);

  // Contact Info
  if (contact.id) {
    h += mkSec('Contact', () => {
      let g = '<div class="dg">';
      g += `<div class="dk">Contact ID</div><div class="dv">${esc(contact.id)}</div>`;

      const info = contact.info || {};
      if (info.name) g += `<div class="dk">Name</div><div class="dv">${esc((info.name.first||'')+' '+(info.name.last||''))}</div>`;

      const pi = contact.primaryInfo;
      if (pi?.email) g += `<div class="dk">Email</div><div class="dv">${esc(pi.email)}</div>`;

      const emails = info.emails?.items || [];
      emails.forEach((e,i) => {
        if (i > 0 || e.email !== pi?.email) g += `<div class="dk">Email ${i+1}</div><div class="dv">${esc(e.email||'')} ${e.primary?'(primary)':''}</div>`;
      });

      const phones = info.phones?.items || [];
      phones.forEach((p,i) => {
        g += `<div class="dk">Phone ${i+1}</div><div class="dv">${esc(p.phone||'')}</div>`;
      });

      if (info.company) g += `<div class="dk">Company</div><div class="dv">${esc(info.company)}</div>`;

      const src = contact.source;
      if (src?.sourceType) g += `<div class="dk">Source</div><div class="dv">${esc(src.sourceType)}</div>`;

      const la = contact.lastActivity;
      if (la?.date) g += `<div class="dk">Last Activity</div><div class="dv">${esc(la.activityType||'')} — ${esc(fmtDate(la.date))} — ${esc(la.description||'')}</div>`;

      g += `<div class="dk">Created</div><div class="dv">${esc(fmtDate(contact.createdDate))}</div>`;
      g += `<div class="dk">Updated</div><div class="dv">${esc(fmtDate(contact.updatedDate))}</div>`;
      g += '</div>';
      return g;
    }, true);
  } else if (contact.error) {
    h += mkSec('Contact', () => `<div style="padding:12px;color:var(--err)">Contact lookup failed: ${esc(contact.error)}</div>`, true);
  }

  h += '</div>';
  m.innerHTML = h;
};

const renderInboxMsgs = () => {
  const msgs = ld.messages || [];
  const types = {};
  msgs.forEach(m => { const t = m.contentType||'?'; types[t]=(types[t]||0)+1; });
  const typeStr = Object.entries(types).map(([k,v])=>`${k}: ${v}`).join(', ');

  const m = $('M');
  m.innerHTML = mkBc([{label:'Inbox',action:'back()'},{label:convId}])
    + `<div class="tb"><span class="tb-t">Messages</span><span class="tb-c">${msgs.length} messages (${typeStr})</span></div>`;

  let h = '<div class="msg-list">';
  // 시간순 오름차순 (오래된 것 위, 새 것 아래 — 채팅 스레드 순서)
  const sorted = [...msgs].sort((a,b) => (a.createdDate||'').localeCompare(b.createdDate||''));
  sorted.forEach(msg => {
    const isIn = msg.direction === 'PARTICIPANT_TO_BUSINESS';
    const dir = isIn ? 'in' : 'out';
    const senderLabel = isIn ? (msg.sender?.contactId ? 'Contact' : 'Visitor') : 'Business';
    const color = isIn ? '#45B7D1' : '#7B68EE';
    const init = isIn ? '←' : '→';
    const ct = msg.contentType || 'UNKNOWN';

    h += `<div class="msg-item ${dir}">`;
    h += `<div class="msg-ava" style="background:${color}">${init}</div>`;
    h += `<div class="msg-bubble">`;

    // 유형별 렌더링
    switch(ct) {
      case 'BASIC':
        h += `<div>${esc(msg.basicText || msg.previewText || '')}</div>`;
        break;
      case 'MINIMAL':
        h += `<div class="msg-minimal">${esc(msg.previewText || '')}</div>`;
        break;
      case 'FORM':
        h += `<div><strong>${esc(msg.formData?.title || 'Form')}</strong></div>`;
        if (msg.formData?.fields) {
          h += '<div class="msg-form-fields">';
          msg.formData.fields.forEach(f => {
            h += `<div class="ff"><span class="ff-n">${esc(f.name||'')}</span><span class="ff-v">${esc(f.value||'')}</span></div>`;
          });
          h += '</div>';
        }
        break;
      case 'TEMPLATE':
        h += `<div>${esc(msg.previewText || 'Template message')}</div>`;
        break;
      default:
        h += `<div>${esc(msg.previewText || JSON.stringify(msg).slice(0,100))}</div>`;
    }

    h += `<div class="msg-meta">`;
    h += `<span>${fmtDate(msg.createdDate)}</span>`;
    h += `<span class="msg-type">${esc(ct)}</span>`;
    h += `<span>${esc(msg.sourceChannel||'')}</span>`;
    h += `<span>${esc(senderLabel)}</span>`;
    h += `</div></div></div>`;
  });

  if(ld.nextCursor) h += `<div style="text-align:center;padding:12px"><a style="cursor:pointer;color:var(--tx2)" onclick="loadMoreMsgs()">Load more...</a></div>`;
  h += '</div>';
  m.innerHTML += h;
};

const loadMoreMsgs = async () => {
  if(!ld.nextCursor) return;
  try {
    const more = await api(`/api/inbox/conversations/${encodeURIComponent(convId)}/messages?limit=30&visibility=BUSINESS&cursor=${encodeURIComponent(ld.nextCursor)}`);
    ld.messages = [...(ld.messages||[]), ...(more.messages||[])];
    ld.nextCursor = more.nextCursor || '';
    renderInboxMsgs();
  } catch(e) { /* ignore */ }
};

/* ═══ Detail ═══ */
const renderDetail = () => {
  if(!dd){$('M').innerHTML='<div class="empty">No detail</div>';return}
  const bcHtml = hist.length ? mkBc([{label:'Back',action:'back()'}]) : '';
  const prims=[], objs=[];
  Object.entries(dd).forEach(([k,v]) => {
    (v!==null && typeof v==='object' ? objs : prims).push([k,v]);
  });
  let h = bcHtml+'<div class="det">';
  if(prims.length) h += mkSec('Basic Info', () => {
    let g='<div class="dg">';
    prims.forEach(([k,v]) => {
      g+=`<div class="dk">${esc(k)}</div><div class="dv">${v===null?'<span style="color:var(--txm)">null</span>':esc(String(v))}</div>`;
    });
    return g+'</div>';
  }, true);
  objs.forEach(([k,v]) => h += mkSec(k, () => renderKV(v,0), true));
  h+=`<div class="dr"><div class="dr-h"><span>Raw JSON</span><a onclick="navigator.clipboard?.writeText(JSON.stringify(dd,null,2))">Copy</a></div><div class="dr-b"><pre>${hl(dd)}</pre></div></div></div>`;
  $('M').innerHTML=h;
};

/* ═══ Smart Table ═══ */
const smartTable = (rows, cols, onClick) => {
  if(!rows.length) return '<div class="empty">No data</div>';
  window._tblClick = onClick;
  const sorted = doSort(rows, cols);
  let h='<div class="tw"><table class="tbl"><thead><tr>';
  cols.forEach(c => h+=`<th onclick="sortBy('${esc(c.key)}')">${esc(c.label)}<span class="ar">${sCol===c.key?(sDir>0?'▲':'▼'):''}</span></th>`);
  h+='</tr></thead><tbody>';
  sorted.forEach((r,i) => {
    h+=`<tr onclick="_tblClick(${i})">`;
    cols.forEach(c => {
      const raw = r[c.key];
      if(c.fmt) h+=`<td${typeof raw==='string'&&isUUID(raw)?' class="mo"':''}>${esc(c.fmt(raw))}</td>`;
      else h+=cell(raw, c.key);
    });
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
};

const cell = (v, key) => {
  if(v===null||v===undefined) return '<td style="color:var(--txm)">-</td>';
  if(typeof v==='object'){
    const display = extractDisplay(key, v);
    if(display!=='-' && !display.endsWith('...')) return `<td>${esc(display)}</td>`;
    const s=JSON.stringify(v); const sh=s.length>40?s.slice(0,40)+'...':s;
    return `<td><span class="jb" onclick="event.stopPropagation();openJ('${esc(key)}','${esc(s)}')" title="${esc(s)}">${esc(sh)}</span></td>`;
  }
  const s=String(v);
  return `<td${isUUID(s)?' class="mo"':''}${s.length>30?' title="'+esc(s)+'"':''}>${esc(s.length>50?s.slice(0,50)+'...':s)}</td>`;
};

/* ═══ Sorting ═══ */
const sortBy = col => { sCol===col ? sDir*=-1 : (sCol=col, sDir=1); renderCached(); };
const doSort = (rows, cols) => {
  if(!sCol) return rows;
  const colDef = cols.find(c => c.key===sCol);
  return [...rows].sort((a,b) => {
    let va = colDef?.fmt ? colDef.fmt(a[sCol]) : extractDisplay(sCol, a[sCol]);
    let vb = colDef?.fmt ? colDef.fmt(b[sCol]) : extractDisplay(sCol, b[sCol]);
    if(va==='-')va=''; if(vb==='-')vb='';
    return String(va).localeCompare(String(vb))*sDir;
  });
};

/* ═══ Toolbar / Breadcrumb ═══ */
const toolbar = (title,total,count) =>
  `<div class="tb"><span class="tb-t">${esc(title)}</span><span class="tb-c">${total!=null?total+' total':''}</span><div class="tb-r"><span class="tb-pg">${off+1}-${off+count}</span><button class="tb-btn" onclick="prevPg()" ${off<=0?'disabled':''}>Prev</button><button class="tb-btn" onclick="nextPg()" ${count<lim?'disabled':''}>Next</button></div></div>`;

const mkBc = items => {
  let h='<div class="bc">';
  items.forEach((it,i) => {if(i>0)h+='<span class="sep">/</span>';h+=it.action?`<a onclick="${it.action}">${esc(it.label)}</a>`:`<span class="cur">${esc(it.label)}</span>`});
  return h+'</div>';
};

/* ═══ Section / KV ═══ */
const mkSec = (title, contentFn, open) => {
  const id='s'+Math.random().toString(36).slice(2,8);
  return `<div class="ds"><div class="ds-h" onclick="toggleS('${id}')"><span class="ar${open?'':' cl'}" id="${id}_a">▼</span>${esc(title)}</div><div class="ds-b${open?'':' cl'}" id="${id}" style="max-height:${open?'9999px':'0'}">${contentFn()}</div></div>`;
};
const toggleS = id => { const b=$(id),a=$(id+'_a'); b.classList.toggle('cl'); a.classList.toggle('cl'); b.style.maxHeight=b.classList.contains('cl')?'0':'9999px'; };

const renderKV = (obj, depth) => {
  if(obj==null) return '<span style="color:var(--txm)">null</span>';
  if(typeof obj!=='object') return esc(String(obj));
  // Wix $date object → formatted date string
  if(obj.$date && Object.keys(obj).length===1) return esc(fmtDate(obj.$date));
  if(Array.isArray(obj)){
    if(!obj.length) return '<span style="color:var(--txm)">[] empty</span>';
    if(typeof obj[0]!=='object') return '<div class="dg">'+obj.map((v,i)=>`<div class="dk">[${i}]</div><div class="dv">${esc(String(v))}</div>`).join('')+'</div>';
    const ks=[...new Set(obj.flatMap(r=>r&&typeof r==='object'?Object.keys(r):[]))];
    let t='<table class="tbl" style="font-size:11px;margin:4px 0"><thead><tr>';
    ks.forEach(c=>t+=`<th style="padding:4px 8px">${esc(c)}</th>`);
    t+='</tr></thead><tbody>';
    obj.forEach(r=>{t+='<tr>';ks.forEach(c=>{
      const v=r?.[c];
      t+=typeof v==='object'&&v!=null
        ?`<td style="padding:3px 8px"><span class="jb" onclick="openJ('${esc(c)}','${esc(JSON.stringify(v))}')">${esc(JSON.stringify(v).slice(0,40))}</span></td>`
        :`<td style="padding:3px 8px">${v==null?'-':esc(String(v).slice(0,60))}</td>`;
    });t+='</tr>'});
    return t+'</tbody></table>';
  }
  let h='<div class="dg">';
  Object.entries(obj).forEach(([k,v])=>{
    h+=`<div class="dk">${esc(k)}</div>`;
    if(v==null) h+=`<div class="dv"><span style="color:var(--txm)">null</span></div>`;
    else if(Array.isArray(v)) h+=`<div class="dv" style="padding:4px 8px">${renderKV(v,depth+1)}</div>`;
    else if(typeof v==='object'){
      if(depth<2) h+=`<div class="dv" style="padding:0">${renderKV(v,depth+1)}</div>`;
      else{const s=JSON.stringify(v);h+=`<div class="dv lk" onclick="openJ('${esc(k)}','${esc(s)}')">${esc(s.slice(0,80)+(s.length>80?'...':''))}</div>`}
    }else h+=`<div class="dv">${esc(String(v))}</div>`;
  });
  return h+'</div>';
};

/* ═══ Pagination ═══ */
const prevPg = () => { if(off>=lim){off-=lim;load()} };
const nextPg = () => { off+=lim; load(); };

/* ═══ Modals ═══ */
const openJ = (title, jsonStr) => { let d;try{d=JSON.parse(jsonStr)}catch{d=jsonStr} $('jT').textContent=title; $('jB').innerHTML=hl(d); $('jMo').classList.add('open'); };
const closeJ = () => $('jMo').classList.remove('open');
const openSet = () => $('setMo').classList.add('open');
const closeSet = () => $('setMo').classList.remove('open');

const testSave = async () => {
  const lb=$('setLbl'),bt=$('btnSv'),c=cred();
  if(!c.k||!c.s){lb.textContent='Key/SiteID required';lb.className='hd-label fail';return}
  bt.disabled=true;lb.textContent='Testing...';lb.className='hd-label idle';
  try{
    const r=await fetch('/api/contacts/labels?limit=1',{headers:hdrs()});
    if(r.ok){
      lb.textContent='Connected';lb.className='hd-label ok';
      $('connLabel').textContent='Connected';$('connLabel').className='hd-label ok';
      localStorage.setItem('wix_ak',c.k);localStorage.setItem('wix_si',c.s);
      setTimeout(()=>{closeSet();load()},400);
    }else{lb.textContent='Error '+r.status;lb.className='hd-label fail';$('connLabel').textContent='Disconnected';$('connLabel').className='hd-label fail'}
  }catch{lb.textContent='Network error';lb.className='hd-label fail'}
  finally{bt.disabled=false}
};

/* ═══ Keyboard ═══ */
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){closeJ();closeSet()}
  if(e.key==='Backspace'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))back();
});

/* ═══ Init ═══ */
const eAK=$('cAK'), eSI=$('cSI');
eAK.value=localStorage.getItem('wix_ak')||'';
eSI.value=localStorage.getItem('wix_si')||'';
fetch('/api/config/defaults').then(r=>r.json()).then(d=>{
  if(!eAK.value&&d.apiKey)eAK.value=d.apiKey;
  if(!eSI.value&&d.siteId)eSI.value=d.siteId;
  if(eAK.value&&eSI.value){localStorage.setItem('wix_ak',eAK.value);localStorage.setItem('wix_si',eSI.value);testSave()}
  else openSet();
}).catch(()=>{if(eAK.value&&eSI.value)load();else openSet()});
</script>
